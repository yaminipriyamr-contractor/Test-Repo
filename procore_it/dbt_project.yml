# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models.
name: snowflake_it
version: '1.0.0'
config-version: 2

flags:
  source_freshness_run_project_hooks: True

# This setting configures which "profile" dbt uses for this project.
profile: 'snowflake-it'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: [ "models", "sources" ]
analysis-paths: [ "analysis" ]
test-paths: [ "tests" ]
seed-paths: [ "data" ]
macro-paths: [ "macros" ]
snapshot-paths: [ "snapshots" ]

target-path: "target" # directory which will store compiled SQL files
clean-targets:
# directories to be removed by `dbt clean`
- "target"
- "dbt_packages"

on-run-end: "{% if target.database.lower() == 'procore_it' %}{{ dbt_artifacts.upload_results(results) }}{% endif %}" # using target database due to n number of "prod" targets

# Variables
vars:
  ### package agnostic variables
  'dbt_date:time_zone': 'America/Los_Angeles'
  # have elementary upload artifacts on every on-run-end hook, specific to current-state tables (dbt_run_results, dbt_invocations, elementary_test_results, etc. still uploaded by default)
  disable_dbt_artifacts_autoupload: false
  # set to 0 so the elementary pkg doesn't store test failure outputs in test_result_rows table
  test_sample_row_count: 0
  ### package specific variables
  data_diff:
    prod_database: 'procore_it'
  dbt_expectations:
    'dbt_date:time_zone': 'America/Los_Angeles'
  snowflake_it:
    execution_date: '2017-06-01'
    is_airflow_incremental_run: false
    large_warehouse: "{% if target.name.lower() == 'prod' %} ddl_deployment_dbm_large_wh {% elif target.name.lower() == 'prod_ci' or target.name.lower() == 'pullrequest' %} ddl_deployment_dbm_large_wh_pr {% else %} ddl_deployment_dbm_large_wh_dev {% endif %}"
    xlarge_warehouse: "{% if target.name.lower() == 'prod' %} ddl_deployment_dbm_xlarge_wh {% elif target.name.lower() == 'prod_ci' or target.name.lower() == 'pullrequest' %} ddl_deployment_dbm_xlarge_wh_pr {% else %} ddl_deployment_dbm_xlarge_wh_dev {% endif %}"
    2xlarge_warehouse: "{% if target.name.lower() == 'prod' %} ddl_deployment_dbm_2xlarge_wh {% elif target.name.lower() == 'prod_ci' or target.name.lower() == 'pullrequest' %} ddl_deployment_dbm_2xlarge_wh_pr {% else %} ddl_deployment_dbm_2xlarge_wh_dev {% endif %}"
    qas_warehouse: "{% if target.name.lower() == 'prod' %} ddl_deployment_dbm_medium_qas_wh {% elif target.name.lower() == 'prod_ci' or target.name.lower() == 'pullrequest' %} ddl_deployment_dbm_medium_qas_wh_pr {% else %} ddl_deployment_dbm_medium_qas_wh_dev {% endif %}"
    recursive_warehouse: "{% if target.name.lower() == 'prod' %} ddl_deployment_pdp_xlarge_rec_wh {% elif target.name.lower() == 'prod_ci' or target.name.lower() == 'pullrequest' %} ddl_deployment_pdp_xlarge_rec_wh_pr {% else %} ddl_deployment_pdp_xlarge_rec_wh_dev {% endif %}"
    pdp_mdm_database: 'pdp_mdm'
    pdp_corporate_reporting: 'pdp_corporate_reporting'
    pdp_data_science_db: 'pdp_data_science'
    talent_sensitive_db: 'talent_sensitive'

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/ directory
# as tables. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.
models:
  +on_schema_change: "sync_all_columns"
  +transient: false
  +copy_grants: true
  +pre-hook:
  - "ALTER SESSION SET TIMEZONE = 'UTC'"
  - "insert into _monitoring.dbt_audit (event_name, event_timestamp, event_schema, event_model) values ( 'starting model deployment', current_timestamp(), '{{this.schema}}', '{{this.name}}')"
  +post-hook:
  - "ALTER SESSION SET TIMEZONE = 'UTC'"
  - "insert into _monitoring.dbt_audit (event_name, event_timestamp, event_schema, event_model) values ( 'completed model deployment', current_timestamp(), '{{this.schema}}', '{{this.name}}')"
  dbt_artifacts:
    +schema: pkg_dbt_artifacts
  elementary:
    +enabled: "{{ target.database.lower() == 'procore_it' }}" # using target database due to n number of "prod" targets
    +schema: "pkg_elementary"
  re_data:
    +schema: pkg_re
    internal:
      +schema: pkg_re_internal
