version: 2

models:
  - name: opportunity_engagement_book_prep
    description: '{{ doc("opportunity_engagement_book_prep") }}'
    tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          column_list: ["account_id", "opportunity_id", "up_for_renewal_date","engagement_year_number"]
      - dbt_expectations.expect_column_to_exist:
          column_name: data_as_of
      - dbt_utils.recency:
          datepart: hours
          field: data_as_of
          interval: 15
          severity: warn
      - dbt_utils.recency:
          datepart: hours
          field: data_as_of
          interval: 30
          severity: error
    columns:
      - name: data_as_of
        tests:
          - not_null
          - dbt_utils.at_least_one
