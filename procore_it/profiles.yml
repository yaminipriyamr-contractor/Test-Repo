      account: procoreit

      #User/password auth
      user: ddl_deployment_cicd_user
      private_key: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
      role: ddl_deployment_role
      database: procore_it
      warehouse: ddl_deployment_dbm_wh_pr
      schema: public
      threads: 16
      client_session_keep_alive: False

    prod_large:
      type: snowflake
      account: procoreit

      #User/password auth
      user: ddl_deployment_user
      private_key: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"

      role: ddl_deployment_role
      database: procore_it
      warehouse: ddl_deployment_dbm_large_wh
      schema: public
      threads: 8
      client_session_keep_alive: False

    pullrequest:
      type: snowflake
      account: procoreit

      #User/password auth
      user: ddl_deployment_user
      private_key: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
      role: ddl_deployment_role
      database: "{{ env_var('DBT_PR_DBNAME') }}"
      warehouse: ddl_deployment_dbm_large_wh_pr
      schema: public
      threads: 16
      client_session_keep_alive: False
  target: dev